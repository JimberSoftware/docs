<body>
  <div class="sidebar-logo">
    <img src="logo.png" alt="Logo">
  </div>
  <div id="app">
    
  </div>
  <script>
    window.$docsify = {
      alias: { '/.*/_sidebar.md': '_sidebar.md' },
      search: 'auto', // default
      subMaxLevel: 1,
      logo: 'logo.png', // Add your logo path here
      el: "#app",
      repo: './',
      loadSidebar: true,
      'flexible-alerts': {
      style: 'flat'
    },
    plugins: [
        function (hook, vm) {
          hook.afterEach(function(html, next) {
            // Scroll to top
            document.documentElement.scrollTop = 0;
            document.body.scrollTop = 0;
            next(html);
          });
        }
      ]
    }
  </script> 
  <script src="//cdn.jsdelivr.net/npm/docsify@5.1.0/dist/docsify.min.js"></script>
