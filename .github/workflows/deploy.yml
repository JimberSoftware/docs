name: Deploy multilingual docs

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "shared/**"
      - "site/**"
      - "scripts/build_site.py"
      - "translation/config.json"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Check generated content
        id: content
        run: |
          if find content/en -type f -name '*.md' -print -quit 2>/dev/null | grep -q .; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "### Deployment skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "The first translation synchronization has not run yet." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Validate translations
        if: steps.content.outputs.ready == 'true'
        run: python -m scripts.validate_docs

      - name: Build site
        if: steps.content.outputs.ready == 'true'
        run: python -m scripts.build_site

      - uses: actions/configure-pages@v5
        if: steps.content.outputs.ready == 'true'

      - uses: actions/upload-pages-artifact@v4
        if: steps.content.outputs.ready == 'true'
        with:
          path: public

      - name: Deploy to GitHub Pages
        if: steps.content.outputs.ready == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
