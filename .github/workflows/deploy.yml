name: Deploy multilingual documentation

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      action:
        required: false
        type: string
        default: deploy
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        type: choice
        default: testing
        options:
          - testing
          - staging
          - production
      action:
        description: "Deploy or remove the selected environment"
        required: true
        type: choice
        default: deploy
        options:
          - deploy
          - remove

permissions:
  contents: read
  packages: write

concurrency:
  group: documentation-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  build:
    if: inputs.action == 'deploy'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.reference }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Validate deployment target
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: python -m scripts.environment_config "$TARGET_ENVIRONMENT" --require-enabled

      - name: Validate generated documentation
        run: |
          python -m unittest discover -v
          python -m scripts.validate_docs
          python -m scripts.build_site --base-path /documentation

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Select image reference
        id: image
        run: echo "reference=ghcr.io/jimbersoftware/docs/site:$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.reference }}

  deploy-testing:
    if: inputs.action == 'deploy' && inputs.environment == 'testing'
    needs: build
    runs-on: signal-server-multi-env
    environment:
      name: testing
      url: https://sase.testing.jimber.io/documentation/
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: docker-compose.yml
          sparse-checkout-cone-mode: false
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          logout: false
      - name: Deploy documentation
        env:
          DOCUMENTATION_IMAGE: ${{ needs.build.outputs.image }}
          ENVIRONMENT: testing
          SASE_DOMAIN: sase.testing.jimber.io
          TRAEFIK_NETWORK: traefik-proxy
        run: |
          docker compose -p documentation-testing pull
          docker compose -p documentation-testing up -d

  deploy-staging:
    if: inputs.action == 'deploy' && inputs.environment == 'staging'
    needs: build
    runs-on: signal-server-multi-env
    environment:
      name: staging
      url: https://sase.staging.jimber.io/documentation/
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: docker-compose.yml
          sparse-checkout-cone-mode: false
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          logout: false
      - name: Deploy documentation
        env:
          DOCUMENTATION_IMAGE: ${{ needs.build.outputs.image }}
          ENVIRONMENT: staging
          SASE_DOMAIN: sase.staging.jimber.io
          TRAEFIK_NETWORK: traefik-proxy
        run: |
          docker compose -p documentation-staging pull
          docker compose -p documentation-staging up -d

  deploy-production:
    if: inputs.action == 'deploy' && inputs.environment == 'production'
    needs: build
    strategy:
      fail-fast: false
      matrix:
        runner:
          - signal1-ovh-group-runner
          - signal2-ovh-group-runner
    runs-on: ${{ matrix.runner }}
    environment:
      name: production
      url: https://sase.jimber.io/documentation/
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: docker-compose.yml
          sparse-checkout-cone-mode: false
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          logout: false
      - name: Deploy documentation
        env:
          DOCUMENTATION_IMAGE: ${{ needs.build.outputs.image }}
          ENVIRONMENT: production
          SASE_DOMAIN: sase.jimber.io
          TRAEFIK_NETWORK: proxy
        run: |
          docker compose -p documentation-production pull
          docker compose -p documentation-production up -d

  remove-testing:
    if: inputs.action == 'remove' && inputs.environment == 'testing'
    runs-on: signal-server-multi-env
    environment: testing
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: docker-compose.yml
          sparse-checkout-cone-mode: false
      - name: Remove documentation
        env:
          DOCUMENTATION_IMAGE: unused
          ENVIRONMENT: testing
          SASE_DOMAIN: sase.testing.jimber.io
          TRAEFIK_NETWORK: traefik-proxy
        run: docker compose -p documentation-testing down

  remove-staging:
    if: inputs.action == 'remove' && inputs.environment == 'staging'
    runs-on: signal-server-multi-env
    environment: staging
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: docker-compose.yml
          sparse-checkout-cone-mode: false
      - name: Remove documentation
        env:
          DOCUMENTATION_IMAGE: unused
          ENVIRONMENT: staging
          SASE_DOMAIN: sase.staging.jimber.io
          TRAEFIK_NETWORK: traefik-proxy
        run: docker compose -p documentation-staging down

  remove-production:
    if: inputs.action == 'remove' && inputs.environment == 'production'
    strategy:
      fail-fast: false
      matrix:
        runner:
          - signal1-ovh-group-runner
          - signal2-ovh-group-runner
    runs-on: ${{ matrix.runner }}
    environment: production
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: docker-compose.yml
          sparse-checkout-cone-mode: false
      - name: Remove documentation
        env:
          DOCUMENTATION_IMAGE: unused
          ENVIRONMENT: production
          SASE_DOMAIN: sase.jimber.io
          TRAEFIK_NETWORK: proxy
        run: docker compose -p documentation-production down
