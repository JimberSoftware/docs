name: Synchronize translations

on:
  workflow_dispatch:
  repository_dispatch:
    types: [signalserver-docs-changed]
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: documentation-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      auto_deploy: ${{ steps.environment.outputs.auto_deploy }}
    steps:
      - name: Check out documentation repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Read testing environment configuration
        id: environment
        run: python -m scripts.environment_config testing --github-output >> "$GITHUB_OUTPUT"

      - name: Check translation credentials
        if: steps.environment.outputs.enabled == 'true'
        id: credentials
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "### Synchronization skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "Add a rotated OPENAI_API_KEY Actions secret to enable translation." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out English source documentation
        if: steps.environment.outputs.enabled == 'true' && steps.credentials.outputs.ready == 'true'
        uses: actions/checkout@v6
        with:
          repository: JimberSoftware/jimberfw_signalserver
          ref: ${{ steps.environment.outputs.source_ref }}
          path: .upstream
          ssh-key: ${{ secrets.SIGNALSERVER_DEPLOY_KEY }}
          sparse-checkout: |
            apps/docs
          sparse-checkout-cone-mode: false

      - name: Read source revision
        if: steps.environment.outputs.enabled == 'true' && steps.credentials.outputs.ready == 'true'
        id: source
        run: echo "sha=$(git -C .upstream rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install translation dependencies
        if: steps.environment.outputs.enabled == 'true' && steps.credentials.outputs.ready == 'true'
        run: pip install -r requirements.txt

      - name: Synchronize and translate
        if: steps.environment.outputs.enabled == 'true' && steps.credentials.outputs.ready == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_TRANSLATION_MODEL || 'gpt-6-luna' }}
        run: |
          python -m scripts.sync_docs \
            --source .upstream/apps/docs \
            --source-sha "${{ steps.source.outputs.sha }}"

      - name: Validate generated documentation
        if: steps.environment.outputs.enabled == 'true' && steps.credentials.outputs.ready == 'true'
        run: python -m scripts.validate_docs

      - name: Verify site build
        if: steps.environment.outputs.enabled == 'true' && steps.credentials.outputs.ready == 'true'
        run: python -m scripts.build_site

      - name: Commit synchronized documentation
        if: steps.environment.outputs.enabled == 'true' && steps.credentials.outputs.ready == 'true'
        id: commit
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          SOURCE_REF: ${{ steps.environment.outputs.source_ref }}
        run: |
          git add content shared translation/state.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "jimber-docs-bot[bot]"
          git config user.email "41898282+jimber-docs-bot[bot]@users.noreply.github.com"
          git commit \
            -m "docs(i18n): sync with signalserver ${SOURCE_SHA:0:8}" \
            -m "Source-Ref: $SOURCE_REF" \
            -m "Source-Commit: $SOURCE_SHA" \
            -m "Refs #72"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: sync
    if: needs.sync.outputs.changed == 'true' && needs.sync.outputs.auto_deploy == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/deploy.yml
    with:
      environment: testing
